<style>

/* =========================
RESET
========================= */

body{

/* =========================
TOPO FIXO - LOGO E TÍTULO
========================= */

.topbar{

    background:#E8DCCB;

/* LOGO E TÍTULO */

.logo-area{

    gap:15px;
    width:100%;
    max-width:1200px;
}

.logo-area img{
    width:75px;
    height:auto;
    object-fit:contain;
}

.logo-area h1{
    color:#5A2E2E;
    font-size:28px;
    font-weight:bold;

/* =========================
BARRA DOS BOTÕES
========================= */

.top-buttons{

.top-btn{

}

.top-btn:hover{

    background:#fff;
}

.top-btn i{
    display:block;
    font-size:24px;
    margin-bottom:8px;
}

/* =========================
CONTAINER
========================= */

.container{
    width:95%;
    max-width:1400px;
    margin:25px auto;
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);

/* =========================
FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;

.field label{

}

.field select{

/* =========================
ETAPAS
========================= */

.etapas-grid{

.etapa-item{

/* =========================
TOOLS

/* =========================
ASSINATURA

canvas{

.signature-buttons{

.signature-buttons button{

.clear-sign{

}

}

/* =========================
TABELA
========================= */

.table-container{

    margin-top:30px;
}

table{

    min-width:1700px;
    border-collapse:collapse;
}

thead{

}

th,td{

tbody tr:nth-child(even){

.assinatura-img{

/* =========================
RESPONSIVO

@media(max-width:768px){

<script>

/* =========================
LOCAL STORAGE
========================= */

function salvarDados(){

    localStorage.setItem(
        "dadosFerramentasVM",
        document.getElementById("tbody").innerHTML
    );

}

function carregarDados(){

    const dados =
    localStorage.getItem("dadosFerramentasVM");

    if(dados){

        document.getElementById("tbody").innerHTML =
        dados;

    }

}

/* =========================
PESSOAS
========================= */

function carregarPessoas(){

    return JSON.parse(
        localStorage.getItem("pessoasVM")
    ) || [];

}

function salvarPessoas(lista){

    localStorage.setItem(
        "pessoasVM",
        JSON.stringify(lista)
    );

}

function cadastrarPessoa(){

    let nome =
    prompt("Digite o nome da pessoa:");

    if(!nome) return;

    nome = nome.trim();

    let pessoas = carregarPessoas();

    if(!pessoas.includes(nome)){

        pessoas.push(nome);

        pessoas.sort();

        salvarPessoas(pessoas);

        atualizarSelectPessoas();

    }else{

        alert("Pessoa já cadastrada.");

    }

}

function atualizarSelectPessoas(){

    const select =
    document.getElementById("nomePessoa");

    select.innerHTML =
    `<option value="">Selecione</option>`;

    carregarPessoas().forEach(p=>{

        select.innerHTML +=
        `<option>${p}</option>`;

    });

}

/* =========================
GRUPOS
========================= */

function carregarGrupos(){

    return JSON.parse(
        localStorage.getItem("gruposVM")
    ) || [];

}

function salvarGrupos(lista){

    localStorage.setItem(
        "gruposVM",
        JSON.stringify(lista)
    );

}

function cadastrarGrupo(){

    let grupo =
    prompt("Digite o nome do grupo:");

    if(!grupo) return;

    grupo = grupo.trim();

    let grupos = carregarGrupos();

    if(!grupos.includes(grupo)){

        grupos.push(grupo);

        grupos.sort();

        salvarGrupos(grupos);

        atualizarSelectGrupos();

    }else{

        alert("Grupo já cadastrado.");

    }

}

function atualizarSelectGrupos(){

    const select =
    document.getElementById("grupoPessoa");

    select.innerHTML =
    `<option>Avulso - Sem grupo</option>`;

    carregarGrupos().forEach(g=>{

        select.innerHTML +=
        `<option>${g}</option>`;

    });

}

/* =========================
FERRAMENTAS
========================= */

const ferramentas = {

"Ferramenta grande":[

let ferramentasSelecionadas = {};

function mostrarFerramentas(){

    const categoria =
    document.getElementById("categoria").value;

    const grid =
    document.getElementById("toolsGrid");

    grid.innerHTML = "";

    if(!categoria) return;

    ferramentas[categoria].forEach(nome=>{

        if(!ferramentasSelecionadas[nome]){

            ferramentasSelecionadas[nome] = {

                quantidade:1,
                categoria:categoria,
                selecionado:false

            };

        }

        const item =
        ferramentasSelecionadas[nome];

        grid.innerHTML += `

            <div class="tool-card">

                <div class="tool-left">

                    <input
                        type="checkbox"
                        onchange="toggleFerramenta('${nome}', this.checked)"
                        ${item.selecionado ? "checked" : ""}
                    >

                    <div class="tool-name">
                        ${nome}
                    </div>

                </div>

                <div class="quantity-box">

                    <button
                        class="quantity-btn"
                        type="button"
                        onclick="alterarQuantidade('${nome}', -1)"
                    >
                        -
                    </button>

                    <div
                        class="quantity-number"
                        id="qtd-${nome}"
                    >
                        ${item.quantidade}
                    </div>

                    <button
                        class="quantity-btn"
                        type="button"
                        onclick="alterarQuantidade('${nome}', 1)"
                    >
                        +
                    </button>

                </div>

            </div>

        `;

    });

}

function toggleFerramenta(nome, checked){

    ferramentasSelecionadas[nome].selecionado =
    checked;

}

function alterarQuantidade(nome, valor){

    ferramentasSelecionadas[nome].quantidade += valor;

    if(ferramentasSelecionadas[nome].quantidade < 1){

        ferramentasSelecionadas[nome].quantidade = 1;

    }

    document.getElementById(`qtd-${nome}`).innerText =
    ferramentasSelecionadas[nome].quantidade;

}

/* =========================
RESUMO
========================= */

function mostrarResumo(){

    const nome =
    document.getElementById("nomePessoa").value;

    const grupo =
    document.getElementById("grupoPessoa").value;

    const entreguePor =
    document.getElementById("entreguePor").value;

    const etapa =
    document.querySelector('input[name="etapa"]:checked');

    if(
        !nome ||
        !grupo ||
        !entreguePor ||
        !etapa
    ){

        alert("Preencha todos os campos.");
        return;

    }

    const selecionadas =
    Object.entries(ferramentasSelecionadas)
    .filter(([_,dados])=>dados.selecionado);

    if(selecionadas.length === 0){

        alert("Selecione ferramentas.");
        return;

    }

    const lista =
    document.getElementById("listaResumo");

    lista.innerHTML = "";

    selecionadas.forEach(([nome,dados])=>{

        lista.innerHTML += `
            <li>
                ${nome}: ${dados.quantidade}
            </li>
        `;

    });

    document.getElementById("resumo").style.display =
    "block";

}

/* =========================
ASSINATURA
========================= */

const canvas =
document.getElementById("signatureCanvas");

const ctx =
canvas.getContext("2d");

canvas.width = 500;
canvas.height = 200;

let desenhando = false;

function pegarPosicao(e){

    const rect =
    canvas.getBoundingClientRect();

    if(e.touches){

        return {

            x:e.touches[0].clientX - rect.left,
            y:e.touches[0].clientY - rect.top

        };

    }

    return {

        x:e.clientX - rect.left,
        y:e.clientY - rect.top

    };

}

function iniciar(e){

    desenhando = true;

    const pos = pegarPosicao(e);

    ctx.beginPath();

    ctx.moveTo(pos.x,pos.y);

}

function desenhar(e){

    if(!desenhando) return;

    e.preventDefault();

    const pos = pegarPosicao(e);

    ctx.lineTo(pos.x,pos.y);

    ctx.strokeStyle = "#000";

    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.stroke();

}

function parar(){

    desenhando = false;

}

canvas.addEventListener("mousedown", iniciar);
canvas.addEventListener("mousemove", desenhar);
canvas.addEventListener("mouseup", parar);

canvas.addEventListener("touchstart", iniciar);
canvas.addEventListener("touchmove", desenhar);
canvas.addEventListener("touchend", parar);

function limparAssinatura(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

/* =========================
CONFIRMAR ENTREGA
========================= */

function confirmarEntrega(event){

    event.preventDefault();

    const assinatura =
    canvas.toDataURL("image/png");

    const nome =
    document.getElementById("nomePessoa").value;

    const grupo =
    document.getElementById("grupoPessoa").value;

    const entreguePor =
    document.getElementById("entreguePor").value;

    const categoria =
    document.getElementById("categoria").value;

    const etapa =
    document.querySelector('input[name="etapa"]:checked').value;

    const data =
    new Date().toLocaleString("pt-BR");

    const tbody =
    document.getElementById("tbody");

    const ferramentasEscolhidas =
    Object.entries(ferramentasSelecionadas)
    .filter(([_,dados]) => dados.selecionado);

    ferramentasEscolhidas.forEach(([ferramenta,dados])=>{

        const tr = document.createElement("tr");

        tr.innerHTML = `

            <td>${nome}</td>

            <td>${grupo}</td>

            <td>${categoria}</td>

            <td>${ferramenta}</td>

            <td>${dados.quantidade}</td>

                    <td>${etapa}</td>

            <td>${data}</td>

            <td>${entreguePor}</td>

            <td>
                <input
                    type="checkbox"
                    class="checkbox"
                >
            </td>

            <td>
                <img
                    src="${assinatura}"
                    class="assinatura-img"
                >
            </td>

        `;

        tbody.prepend(tr);

    });

    salvarDados();

    alert("Entrega confirmada!");

    limparAssinatura();

    document.getElementById("resumo").style.display =
    "none";

}

/* =========================
LIMPAR TABELA
========================= */

function limparTabela(){

    if(confirm("Deseja limpar toda a tabela?")){

        document.getElementById("tbody").innerHTML = "";

        localStorage.removeItem("dadosFerramentasVM");

    }

}

function baixarPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF("l","mm","a4");

    const dataAtual = new Date();

    const nomeArquivo =
    `Controle de Ferramentas - ${
        dataAtual.toLocaleDateString("pt-BR")
    } ${
        dataAtual.toLocaleTimeString("pt-BR").replace(/:/g,"-")
    }.pdf`;

    doc.setFontSize(18);

    doc.text(
        "Controle de Ferramentas - Viana e Moura",
        14,
        15
    );

    const linhas = [];

    const assinaturas = [];

    document.querySelectorAll("#tbody tr")
    .forEach(tr=>{

        const tds = tr.querySelectorAll("td");

        linhas.push([

            tds[0].innerText,
            tds[1].innerText,
            tds[2].innerText,
            tds[3].innerText,
            tds[4].innerText,
            tds[5].innerText,
            tds[6].innerText,
            tds[7].innerText,

            tds[8].querySelector("input").checked
            ? "Devolvido"
            : "Pendente",

            ""

        ]);

        const img =
        tds[9].querySelector("img");

        assinaturas.push(
            img ? img.src : null
        );

    });

    doc.autoTable({

        head:[[
            "Nome",
            "Grupo",
            "Categoria",
            "Ferramenta",
            "Qtd",
            "Etapa",
            "Data",
            "Entregue por",
            "Devolução",
            "Assinatura"
        ]],

        body:linhas,

        startY:25,

        styles:{
            fontSize:8,
            cellPadding:2,
            minCellHeight:18
        },

        columnStyles:{
            9:{
                cellWidth:35
            }
        },

        didDrawCell:function(data){

            if(
                data.section === "body" &&
                data.column.index === 9
            ){

                const assinatura =
                assinaturas[data.row.index];

                if(assinatura){

                    doc.addImage(

                        assinatura,

                        "PNG",

                        data.cell.x + 1,

                        data.cell.y + 1,

                        32,

                        14

                    );

                }

            }

        }

    });

    doc.save(nomeArquivo);

}

INICIAR

carregarDados();

atualizarSelectPessoas();

atualizarSelectGrupos();
